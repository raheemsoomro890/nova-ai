<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova AI</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<header>

<div class="logo">
🤖 Nova AI
</div>

<div class="status">
🟢 ONLINE
</div>

</header>

<section class="hero">

<h1>Nova AI Assistant</h1>

<p>Your Intelligent AI Powered by Abdul Raheem</p>

</section>

<section class="chat-box">

<div class="chat-top">

<button id="newChatBtn">
➕ New Chat
</button>

</div>

<div id="messages" class="messages">

<div class="bot-message">
👋 Welcome to <b>Nova AI</b><br><br>
How can I help you today?
</div>

</div>

<div class="input-area">

<input
type="text"
id="userInput"
placeholder="Ask Nova AI anything..."
autocomplete="off">

<button id="sendBtn">
➤
</button>

</div>

</section>

<footer>

Nova AI © 2025

</footer>

</div>

<script src="script.js"></script>

</body>

</html>
