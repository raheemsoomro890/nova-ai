<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI</title><style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b,#020617);
min-height:100vh;
color:white;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

header{
text-align:center;
padding:30px 0;
}

.logo{
font-size:40px;
font-weight:bold;
}

.hero{
text-align:center;
padding:30px 20px;
}

.hero h1{
font-size:48px;
margin-bottom:10px;
}

.hero p{
opacity:0.8;
}

.chat{
margin-top:30px;
background:rgba(255,255,255,.08);
padding:20px;
border-radius:20px;
}

#messages{
height:350px;
overflow-y:auto;
background:rgba(0,0,0,.25);
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

.input-box{
display:flex;
gap:10px;
}

input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
}

footer{
text-align:center;
padding:30px;
opacity:.7;
}
</style></head><body><div class="container"><header>
<div class="logo">🤖 Nova AI</div>
</header><section class="hero">
<h1>Meet Nova AI</h1>
<p>Your intelligent AI assistant powered by Gemini.</p>
</section><section class="chat"><h2>AI Chat</h2><div id="messages">
<p>👋 Welcome to Nova AI</p>
</div><div class="input-box">
<input id="userInput" placeholder="Ask anything...">
<button id="sendBtn">Send</button>
</div></section><footer>
Nova AI © 2025
</footer></div><script>
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const messages = document.getElementById("messages");

sendBtn.addEventListener("click", async () => {
  const text = input.value.trim();

  if (!text) return;

  messages.innerHTML += `<p><b>You:</b> ${text}</p>`;
  input.value = "";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    messages.innerHTML += `<p><b>Nova AI:</b> ${data.reply || data.error}</p>`;
    messages.scrollTop = messages.scrollHeight;

  } catch (error) {
    messages.innerHTML += `<p><b>Nova AI:</b> Error connecting to AI.</p>`;
  }
});
</script></body>
</html>
